# 复制成 <workspace>.env.yaml 后按项目修改；示例不会自动用于任何 workspace。
version: 1

# 共享服务。check 成功就复用；external 由现有服务管理器启动，run 由 Hub 管进程。
services:
  postgres:
    kind: external
    check: pg_isready -h 127.0.0.1 -p 5432
    start: brew services start postgresql@16
    stop: brew services stop postgresql@16
    timeoutSec: 30
  mock-oauth:
    kind: run
    run: node scripts/mock-oauth.mjs --port {port.oauth}
    ports: [oauth]
    check: curl -fsS http://127.0.0.1:{port.oauth}/health
    timeoutSec: 15

# 每个 worktree 的独占端口；不要手工写死端口号。
ports: [web, api]

# example_template 是预先准备的空测试模板，不是生产库。
database:
  template: example_template
  name: example_wt_{slug}
  exists: "psql -h 127.0.0.1 -lqt | cut -d'|' -f1 | grep -qw {db.name}"
  clone: createdb -h 127.0.0.1 -T {db.template} {db.name}
  drop: dropdb -h 127.0.0.1 --if-exists {db.name}
  url: postgres://127.0.0.1:5432/{db.name}
  refreshTemplate: pnpm db:migrate:template

env:
  PORT: "{port.web}"
  API_PORT: "{port.api}"
  DATABASE_URL: "{db.url}"
  OAUTH_URL: "http://127.0.0.1:{port.oauth}"
  TASK_BRANCH: "{branch}"

# 相对于主 checkout；目标保持相对路径，复制到 worktree。
copy: [.env.test]
setup:
  - pnpm install --frozen-lockfile --prefer-offline
  - pnpm db:migrate
# 只清理本任务资源；共享服务不在这里停。
teardown:
  - pnpm test:cleanup

# fields 可混用公开值、macOS Keychain 服务名、宿主环境变量引用。
accounts:
  staging-users:
    ttlMinutes: 30
    items:
      - id: alice
        fields:
          user: alice@example.test
          password: { keychain: omp-home/example/alice }
      - id: bob
        fields:
          user: bob@example.test
          password: { env: EXAMPLE_BOB_PASSWORD }

# brief 直接引用这些命令。占位符值会做 shell 引用，不要再加一层引号。
test:
  unit: pnpm test:unit
  full: pnpm test
  e2e: pnpm test:e2e -- --base-url http://127.0.0.1:{port.web}
  build: pnpm build

# 可用变量：{repo} {worktree} {branch} {slug} {port.<name>}
# 数据库变量：{db.name} {db.template} {db.url}
# setup 在 {worktree} 执行；需要主仓库脚本时可用 sh {repo}/scripts/check.sh。
