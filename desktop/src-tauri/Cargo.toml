[package]
name = "omp-home"
version = "0.1.9"
description = "A native home for omp"
authors = ["omp-home contributors"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# generate_context! emits serde_json references for plugin configuration.
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"
tokio = { version = "1", features = ["time", "sync"] }
sys-locale = "0.3"
